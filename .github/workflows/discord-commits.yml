name: Discord Commit Notifications

on:
  push:
    branches:
      - main
      - test
      - experimental

concurrency:
  group: discord-commit-notifications-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for rapid commits to settle
        run: sleep 15

      - name: Send grouped commit notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta

          with open(os.environ["GITHUB_EVENT_PATH"], "r") as f:
              event = json.load(f)

          actor = event["sender"]["login"]
          avatar_url = event["sender"]["avatar_url"]
          repo_name = event["repository"]["name"]
          repo_full_name = event["repository"]["full_name"]
          repo_url = event["repository"]["html_url"]
          after_sha = event["after"]

          def parse_time(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          api_url = (
              f"https://api.github.com/repos/{repo_full_name}"
              f"/commits?sha=${{ github.ref_name }}&per_page=50"
          )
          request = urllib.request.Request(
              api_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              latest_commits = json.load(response)

          newest = next(
              (c for c in latest_commits if c["sha"] == after_sha),
              latest_commits[0] if latest_commits else None,
          )

          if newest is None:
              raise RuntimeError("Could not find the pushed commit on the triggering branch.")

          newest_time = parse_time(newest["commit"]["committer"]["date"])
          cutoff = newest_time - timedelta(seconds=60)

          commits = []
          for commit in latest_commits:
              commit_time = parse_time(commit["commit"]["committer"]["date"])
              if commit_time < cutoff:
                  break
              commits.append(commit)

          commits.reverse()

          commit_lines = []
          for commit in commits:
              sha = commit["sha"][:7]
              url = f"{repo_url}/commit/{commit['sha']}"
              message = commit["commit"]["message"].split("\n")[0]
              commit_lines.append(f"[`{sha}`]({url}) — {message}")

          count = len(commits)
          branch = event["ref"].removeprefix("refs/heads/")
          title = f"[{repo_name}:{branch}] {count} new commit{'s' if count != 1 else ''}"

          compare_url = (
              f"{repo_url}/compare/{commits[0]['sha']}...{commits[-1]['sha']}"
              if count > 1
              else f"{repo_url}/commit/{commits[0]['sha']}"
          )

          embed = {
              "author": {
                  "name": actor,
                  "icon_url": avatar_url
              },
              "title": title,
              "url": compare_url,
              "description": "\n".join(commit_lines),
              "color": 5814783
          }

          payload = {
              "embeds": [embed]
          }

          with open("payload.json", "w") as f:
              json.dump(payload, f)

          EOF

          curl \
            --fail-with-body \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$WEBHOOK"
