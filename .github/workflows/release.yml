name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example, v0.5.1)"
        required: true
        type: string
      description:
        description: "Optional release description. Leave blank to use GitHub's generated notes."
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: donnyfly/bingecord

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate version
        shell: bash
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the format vMAJOR.MINOR.PATCH, for example v0.5.1."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/donnyfly/bingecord:${{ inputs.version }}
            ghcr.io/donnyfly/bingecord:${{ github.sha }}
            ghcr.io/donnyfly/bingecord:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Bingecord ${{ inputs.version }}
          target_commitish: main
          body: ${{ inputs.description }}
          generate_release_notes: true
