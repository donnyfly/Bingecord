name: Build and Publish Docker Image

on:
  push:
    branches:
      - test
      - experimental
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: donnyfly/watchrelaybot

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ github.ref_type == 'tag' && format('ghcr.io/donnyfly/watchrelaybot:{0}', github.ref_name) || (github.ref_name == 'experimental' && 'ghcr.io/donnyfly/watchrelaybot:experimental' || 'ghcr.io/donnyfly/watchrelaybot:test') }}
            ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') && 'ghcr.io/donnyfly/watchrelaybot:nightly' || format('ghcr.io/donnyfly/watchrelaybot:{0}', github.sha) }}
            ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') && 'ghcr.io/donnyfly/watchrelaybot:latest' || '' }}
